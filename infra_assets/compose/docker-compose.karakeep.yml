services:
  karakeep-web:
    build:
      context: /opt/src/openclaw/infra_assets/karakeep
      args:
        KARAKEEP_VERSION: ${KARAKEEP_VERSION:-release}
    container_name: karakeep-web
    restart: unless-stopped
    volumes:
      - karakeep-data:/data
    ports:
      - "127.0.0.1:3458:3000"
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://karakeep-meilisearch:7700
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      DATA_DIR: /data

  karakeep-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    container_name: karakeep-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars

  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.37.0
    container_name: karakeep-meilisearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - karakeep-meilisearch:/meili_data

  karakeep-wrapper:
    build: /opt/src/karakeep
    container_name: karakeep-wrapper
    restart: unless-stopped
    env_file:
      - /opt/config/karakeep.env
    volumes:
      - karakeep-wrapper-data:/app/data
    ports:
      - "127.0.0.1:3459:3000"
    depends_on:
      - karakeep-web

volumes:
  karakeep-data:
  karakeep-meilisearch:
  karakeep-wrapper-data:
