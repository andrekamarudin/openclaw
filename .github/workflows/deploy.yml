name: Deploy OpenClaw
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 46.250.234.28
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/src/openclaw
            git pull --ff-only origin master
            bash openclaw-infra/scripts/deploy-openclaw.sh
